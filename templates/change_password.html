{% extends "base.html" %}

{% block title %}Change Password - NAYA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3">Change password</h1>

                    <form method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label" for="current_password">Current password</label>
                            <input type="password" class="form-control" id="current_password"
                                   name="current_password" required>
                            <div class="invalid-feedback">Enter your current password.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">New password</label>
                            <input type="password" class="form-control" id="password" name="new_password"
                                   minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" required>
                            <div class="form-text">8+ characters with uppercase, lowercase and a number.</div>
                            <div class="invalid-feedback">Password does not meet the requirements.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="confirm_password">Confirm new password</label>
                            <input type="password" class="form-control" id="confirm_password"
                                   name="confirm_password" required>
                            <div class="invalid-feedback">Passwords must match.</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Update password</button>
                        <a href="{{ url_for('profile.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
