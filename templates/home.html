{% extends "base.html" %}

{% block title %}NAYA Bubble Laundry Management System{% endblock %}

{% block content %}
<section class="hero">
    <div class="container">
        <h1 class="display-5 fw-bold">NAYA Bubble Laundry</h1>
        <p class="lead">Manage your laundry shop's customers in one place.</p>

        {% if not session.get('user_id') %}
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-lg me-2">Get Started</a>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary btn-lg">Login</a>
        {% else %}
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-lg">Go to Dashboard</a>
        {% endif %}
    </div>
</section>
{% endblock %}
