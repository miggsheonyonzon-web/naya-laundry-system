{% extends "base.html" %}

{% block title %}Verify Email - NAYA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4 fw-bold mb-2">Verify your email</h2>
                    <p class="text-muted">Enter the 6-digit code sent to <strong>{{ email }}</strong>.</p>

                    <form method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label" for="otp">Verification code</label>
                            <input type="text" class="form-control text-center fs-4" id="otp" name="otp"
                                   inputmode="numeric" maxlength="6" pattern="\d{6}"
                                   autocomplete="one-time-code" required>
                            <div class="invalid-feedback">Enter the 6-digit code.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Verify</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        <a href="{{ url_for('auth.register') }}">Start over</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
