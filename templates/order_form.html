{% extends "base.html" %}

{% block title %}New order - NAYA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3">New order</h1>

                    <form method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label" for="customer_id">Customer</label>
                            <select class="form-select" id="customer_id" name="customer_id" required>
                                <option value="">Choose a customer...</option>
                                {% for c in customers %}
                                <option value="{{ c.id }}"
                                    {% if form.get('customer_id') == c.id|string %}selected{% endif %}>
                                    {{ c.full_name }} ({{ c.phone }})
                                </option>
                                {% endfor %}
                            </select>
                            <div class="invalid-feedback">Choose a customer.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="service_type">Service</label>
                            <select class="form-select" id="service_type" name="service_type" required>
                                <option value="">Choose a service...</option>
                                {% for name, rate in services.items() %}
                                <option value="{{ name }}"
                                    {% if form.get('service_type') == name %}selected{% endif %}>
                                    {{ name }} (₱{{ rate }}/kg)
                                </option>
                                {% endfor %}
                            </select>
                            <div class="invalid-feedback">Choose a service.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="weight_kg">Weight (kg)</label>
                            <input type="number" class="form-control" id="weight_kg" name="weight_kg"
                                   value="{{ form.get('weight_kg', '') }}"
                                   min="0.1" max="100" step="0.1" required>
                            <div class="invalid-feedback">Enter a weight between 0.1 and 100 kg.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="notes">Notes <span class="text-muted">(optional)</span></label>
                            <textarea class="form-control" id="notes" name="notes" rows="3"
                                      maxlength="1000">{{ form.get('notes', '') }}</textarea>
                        </div>

                        <p class="text-muted small">The total price is calculated automatically when you save.</p>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Create order</button>
                            <a href="{{ url_for('order.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
