{% extends "base.html" %}

{% block title %}My Profile - NAYA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3">My profile</h1>

                    <form method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="form-label" for="first_name">First name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name"
                                       value="{{ form.get('first_name', '') }}" maxlength="50" required>
                                <div class="invalid-feedback">First name is required.</div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="form-label" for="last_name">Last name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name"
                                       value="{{ form.get('last_name', '') }}" maxlength="50" required>
                                <div class="invalid-feedback">Last name is required.</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ form.get('email', '') }}" maxlength="100" required>
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <a href="{{ url_for('profile.change_password') }}"
                           class="btn btn-outline-secondary">Change password</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
