{% extends "base.html" %}

{% block title %}{{ title }} - NAYA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-3">{{ title }}</h1>

                    <form method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label" for="full_name">Full name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name"
                                   value="{{ form.get('full_name', '') }}" maxlength="100" required>
                            <div class="invalid-feedback">Full name is required.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone"
                                   value="{{ form.get('phone', '') }}" maxlength="20"
                                   pattern="[0-9+\(\)\- ]{7,20}" required>
                            <div class="invalid-feedback">Enter a valid phone number (7-20 characters).</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email <span class="text-muted">(optional)</span></label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ form.get('email', '') }}" maxlength="100">
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="address">Address <span class="text-muted">(optional)</span></label>
                            <input type="text" class="form-control" id="address" name="address"
                                   value="{{ form.get('address', '') }}" maxlength="255">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="notes">Notes <span class="text-muted">(optional)</span></label>
                            <textarea class="form-control" id="notes" name="notes" rows="3"
                                      maxlength="1000">{{ form.get('notes', '') }}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a href="{{ url_for('customer.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
